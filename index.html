<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Reels Review</title>
  <style>
    :root {
      --bg: #0c0d10;
      --card: #171922;
      --text: #eef0f6;
      --muted: #8b90a0;
      --yes: #22c55e;
      --no: #ef4444;
      --skip: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Telugu", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    }
    #topbar {
      padding: 10px 14px; text-align: center; background: #0f1116;
      border-bottom: 1px solid #22262f; font-size: 0.8rem; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center;
    }
    #topbar b { color: var(--text); }
    #card {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; position: relative; touch-action: none;
      overflow: hidden;
    }
    .meta { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; }
    .transcript {
      font-size: 1.35rem; line-height: 1.65; font-weight: 500; text-align: center;
      white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow-y: auto;
      padding: 4px 6px;
    }
    audio { width: 90%; max-width: 420px; margin-top: 16px; }
    #verdict-flash {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 3rem; font-weight: 900; opacity: 0; pointer-events: none; transition: opacity 0.15s;
    }
    #bottombar {
      display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: #0f1116; border-top: 1px solid #22262f;
    }
    .btn {
      flex: 1; padding: 15px 6px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 800; color: #fff; cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .btn.yes { background: var(--yes); }
    .btn.no { background: var(--no); }
    .btn.skip { background: var(--skip); color: #1a1206; }
    .hint {
      text-align: center; font-size: 0.68rem; color: var(--muted);
      padding: 4px 0 8px; background: #0f1116;
    }
    .done { text-align: center; font-size: 1.1rem; padding: 30px 10px; color: var(--yes); line-height: 1.8; }
  </style>
</head>
<body>
  <div id="topbar">
    <span>🎧 <b id="epiLabel">…</b></span>
    <span id="stats">…</span>
  </div>

  <div id="card">
    <div class="meta" id="meta"></div>
    <div class="transcript" id="transcript"></div>
    <audio id="audio" controls preload="none"></audio>
    <div id="verdict-flash"></div>
  </div>

  <div class="hint">
    Swipe <b>right</b> = Yes &nbsp;·&nbsp; <b>left</b> = No &nbsp;·&nbsp; <b>up</b> = Skip
    &nbsp;|&nbsp; Keys: <b>→</b>/<b>←</b>/<b>↑</b>
  </div>

  <div id="bottombar">
    <button class="btn no" id="btnNo">❌ No</button>
    <button class="btn skip" id="btnSkip">⏭️ Skip</button>
    <button class="btn yes" id="btnYes">✅ Yes</button>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
